name: Build Almas Smart Learn

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/AlmasSmartLearn/AlmasSmartLearn.csproj

      - name: Publish single EXE
        run: dotnet publish src/AlmasSmartLearn/AlmasSmartLearn.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AlmasSmartLearn-win-x64
          path: dist/AlmasSmartLearn.exe
          if-no-files-found: error
          retention-days: 30
