<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Almas Game 0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#070b10;color:white;font-family:system-ui;text-align:center}
#loading.hide{display:none}#loading span{color:#aeb8c6}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><b>ALMAS GAME 0</b><br><span id="txt">Карта жүктелуде…</span></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const root=document.querySelector('#game'),loading=document.querySelector('#loading'),txt=document.querySelector('#txt');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ab0c1);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.001,10000);camera.position.set(2,1.3,2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xe7f2ff,0x38404b,2.2));
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,7,3);sun.castShadow=true;scene.add(sun);
const loader=new GLTFLoader();let map,player;

function box(o){o.updateWorldMatrix(true,true);return new THREE.Box3().setFromObject(o)}
function size(o){return box(o).getSize(new THREE.Vector3())}
function floorY(x,z){
 const b=box(map),h=Math.max(.1,b.max.y-b.min.y);
 const ray=new THREE.Raycaster(new THREE.Vector3(x,b.max.y+h*3,z),new THREE.Vector3(0,-1,0),0,h*8);
 const hits=ray.intersectObject(map,true),nm=new THREE.Matrix3(),ys=[];
 for(const hit of hits){if(!hit.face)continue;nm.getNormalMatrix(hit.object.matrixWorld);const n=hit.face.normal.clone().applyMatrix3(nm).normalize();if(n.y>.42)ys.push(hit.point.y)}
 return ys.length?Math.max(...ys):b.min.y;
}
function placePlayer(){
 player.position.set(0,0,0);player.rotation.set(0,0,0);player.scale.set(1,1,1);player.updateMatrixWorld(true);
 const s=size(player);if(s.x>=s.y&&s.x>=s.z)player.rotation.z=Math.PI/2;else if(s.z>=s.x&&s.z>=s.y)player.rotation.x=-Math.PI/2;
 player.updateMatrixWorld(true);
 const mb=box(map),mc=mb.getCenter(new THREE.Vector3()),pb=box(player),pc=pb.getCenter(new THREE.Vector3());
 player.position.x+=mc.x-pc.x;player.position.z+=mc.z-pc.z;player.updateMatrixWorld(true);
 player.position.y+=floorY(player.position.x,player.position.z)-box(player).min.y;
}
function frame(o){
 const b=box(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||1;
 const d=m/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2))*1.45;
 camera.position.set(c.x+d*.75,c.y+d*.55,c.z+d);controls.target.copy(c);controls.update();
}
async function start(){
 try{
  txt.textContent='sendstone_new.glb жүктелуде…';
  map=(await loader.loadAsync('./assets/sendstone_new.glb')).scene;scene.add(map);
  txt.textContent='sas__cs2_agent_model_blue.glb жүктелуде…';
  player=(await loader.loadAsync('./assets/sas__cs2_agent_model_blue.glb')).scene;scene.add(player);
  placePlayer();frame(map);loading.classList.add('hide');
 }catch(e){console.error(e);txt.textContent='Модель файлдары табылмады'}
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
start();
</script>
</body></html>
