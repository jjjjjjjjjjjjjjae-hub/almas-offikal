<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0b0f14"/>
<title>Almas 3D Viewer</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:rgba(17,22,30,.82);--line:rgba(255,255,255,.12);--text:#f6f7f9;--muted:#aeb6c3;--accent:#6ee7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,Arial,sans-serif}
#app,#viewport{position:fixed;inset:0}#viewport canvas{display:block;width:100%;height:100%}
.topbar{position:fixed;left:12px;right:12px;top:12px;z-index:10;display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px)}
.brand{font-weight:800;padding:0 8px;white-space:nowrap}.brand b{color:var(--accent)}
button,.filebtn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
.filebtn{background:linear-gradient(135deg,rgba(110,231,255,.22),rgba(139,92,246,.22))}#files{display:none}.spacer{flex:1}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;max-width:calc(100vw - 24px);padding:9px 13px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}.hintbox{width:min(520px,calc(100vw - 34px));padding:26px;border:1px dashed rgba(255,255,255,.24);border-radius:24px;text-align:center;background:rgba(8,11,16,.55);backdrop-filter:blur(10px)}
.hintbox h1{margin:0 0 8px;font-size:24px}.hintbox p{margin:0;color:var(--muted);line-height:1.5}.drop{outline:2px solid var(--accent);outline-offset:-8px}
@media(max-width:640px){.brand{display:none}.topbar{gap:6px}.topbar button,.filebtn{padding:9px 10px;font-size:13px}.optional{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
<div id="viewport"></div>
<div class="topbar">
<div class="brand">Almas <b>3D</b> Viewer</div>
<label class="filebtn" for="files">📂 3D ашу</label>
<input id="files" type="file" multiple accept=".glb,.gltf,.obj,.stl,.fbx,.bin,.png,.jpg,.jpeg,.webp,.ktx2,.basis"/>
<button id="reset">⌂</button><button id="wire" class="optional">▦ Wire</button><button id="grid" class="optional"># Grid</button>
<div class="spacer"></div><button id="fullscreen">⛶</button>
</div>
<div class="hint" id="hint"><div class="hintbox"><h1>3D модельді аш</h1><p>GLB, GLTF, OBJ, STL, FBX. Файлды таңда немесе терезеге сүйреп таста.</p></div></div>
<div class="status" id="status">Дайын • айналдыр • zoom жаса</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const app=document.querySelector('#app'),viewport=document.querySelector('#viewport'),statusEl=document.querySelector('#status'),hint=document.querySelector('#hint'),fileInput=document.querySelector('#files');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0f14);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,10000);camera.position.set(3,2.2,4);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;viewport.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;
scene.add(new THREE.HemisphereLight(0xddeeff,0x333344,2.2));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,8,4);scene.add(key);const fill=new THREE.DirectionalLight(0x88aaff,1.2);fill.position.set(-4,2,-5);scene.add(fill);
const gridHelper=new THREE.GridHelper(20,20,0x52606f,0x26313c);gridHelper.material.transparent=true;gridHelper.material.opacity=.42;scene.add(gridHelper);
let currentModel=null,mixer=null,wireframe=false;const clock=new THREE.Clock();const setStatus=t=>statusEl.textContent=t;
function disposeObject(obj){obj.traverse(n=>{n.geometry?.dispose?.();const mats=Array.isArray(n.material)?n.material:(n.material?[n.material]:[]);mats.forEach(m=>{Object.values(m).forEach(v=>{if(v&&v.isTexture)v.dispose?.()});m.dispose?.()})})}
function clearModel(){if(currentModel){scene.remove(currentModel);disposeObject(currentModel);currentModel=null}mixer=null}
function normalizeMaterials(root){root.traverse(o=>{if(o.isMesh){const mats=Array.isArray(o.material)?o.material:[o.material];mats.filter(Boolean).forEach(m=>{if('wireframe'in m)m.wireframe=wireframe;if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;m.needsUpdate=true})}})}
function frameObject(obj){obj.updateWorldMatrix(true,true);const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return;const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),maxDim=Math.max(size.x,size.y,size.z)||1,fov=camera.fov*Math.PI/180,dist=Math.abs(maxDim/(2*Math.tan(fov/2)))*1.55;camera.near=Math.max(maxDim/10000,.001);camera.far=Math.max(1000,maxDim*1000);camera.updateProjectionMatrix();camera.position.set(center.x+dist*.8,center.y+dist*.55,center.z+dist);controls.target.copy(center);controls.update()}
function mountModel(obj,name,animations=[]){clearModel();currentModel=obj;normalizeMaterials(obj);scene.add(obj);frameObject(obj);hint.style.display='none';if(animations?.length){mixer=new THREE.AnimationMixer(obj);animations.forEach(a=>mixer.clipAction(a).play())}setStatus(name+' • ашылды')}
const ext=name=>name.toLowerCase().split('.').pop();
async function loadFiles(fileList){const files=[...fileList];if(!files.length)return;const model=files.find(f=>['glb','gltf','obj','stl','fbx'].includes(ext(f.name)));if(!model){setStatus('3D файл табылмады');return}setStatus(model.name+' • жүктелуде…');const urls=new Map(files.map(f=>[f.name,URL.createObjectURL(f)]));const manager=new THREE.LoadingManager();manager.setURLModifier(url=>urls.get(decodeURIComponent(url.split('/').pop().split('?')[0]))||url);try{const e=ext(model.name),u=urls.get(model.name);if(e==='glb'||e==='gltf'){const g=await new GLTFLoader(manager).loadAsync(u);mountModel(g.scene,model.name,g.animations)}else if(e==='obj'){mountModel(await new OBJLoader(manager).loadAsync(u),model.name)}else if(e==='stl'){const geo=await new STLLoader(manager).loadAsync(u);geo.computeVertexNormals();mountModel(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xb9c5d4,roughness:.7})),model.name)}else if(e==='fbx'){const o=await new FBXLoader(manager).loadAsync(u);mountModel(o,model.name,o.animations||[])}}catch(err){console.error(err);setStatus('Қате: '+(err?.message||'модель ашылмады'))}finally{setTimeout(()=>{for(const u of urls.values())URL.revokeObjectURL(u)},5000)}}
fileInput.addEventListener('change',e=>loadFiles(e.target.files));['dragenter','dragover'].forEach(t=>app.addEventListener(t,e=>{e.preventDefault();app.classList.add('drop')}));['dragleave','drop'].forEach(t=>app.addEventListener(t,e=>{e.preventDefault();app.classList.remove('drop')}));app.addEventListener('drop',e=>loadFiles(e.dataTransfer.files));
document.querySelector('#reset').onclick=()=>currentModel&&frameObject(currentModel);document.querySelector('#wire').onclick=()=>{wireframe=!wireframe;if(currentModel)normalizeMaterials(currentModel);setStatus(wireframe?'Wireframe қосылды':'Wireframe өшірілді')};document.querySelector('#grid').onclick=()=>{gridHelper.visible=!gridHelper.visible};document.querySelector('#fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{mixer?.update(clock.getDelta());controls.update();renderer.render(scene,camera)});
</script>
</body></html>
