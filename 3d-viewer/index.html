<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0b0f14"/>
<title>Almas 3D Scene Editor</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:rgba(17,22,30,.88);--line:rgba(255,255,255,.12);--text:#f6f7f9;--muted:#aeb6c3;--accent:#6ee7ff;--purple:#9b7cff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,Arial,sans-serif}
#app,#viewport{position:fixed;inset:0}#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
.topbar{position:fixed;left:12px;right:12px;top:12px;z-index:10;display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px)}
.brand{font-weight:800;padding:0 8px;white-space:nowrap}.brand b{color:var(--accent)}
button,.filebtn,input{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:12px;padding:10px 12px;font-weight:700}
button,.filebtn{cursor:pointer;user-select:none}.filebtn.map{background:linear-gradient(135deg,rgba(110,231,255,.22),rgba(110,231,255,.07))}
.filebtn.char{background:linear-gradient(135deg,rgba(155,124,255,.25),rgba(155,124,255,.08))}
.filebtn.disabled{opacity:.35;pointer-events:none}.files{display:none}.spacer{flex:1}
.panel{position:fixed;right:12px;top:76px;z-index:10;width:min(330px,calc(100vw - 24px));padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);display:none}
.panel.show{display:block}.panel h3{margin:0 0 10px;font-size:15px}.modes,.axisrow,.scaleRow{display:grid;gap:6px;margin-top:8px}.modes{grid-template-columns:repeat(3,1fr)}.axisrow{grid-template-columns:repeat(6,1fr)}.scaleRow{grid-template-columns:repeat(3,1fr)}
.panel button{padding:9px 6px;font-size:12px}.panel button.active{outline:2px solid var(--accent)}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.values label{font-size:11px;color:var(--muted)}.values input{width:100%;padding:8px 7px;margin-top:3px;font-size:12px}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;max-width:calc(100vw - 24px);padding:9px 13px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}.hintbox{width:min(540px,calc(100vw - 34px));padding:26px;border:1px dashed rgba(255,255,255,.24);border-radius:24px;text-align:center;background:rgba(8,11,16,.55);backdrop-filter:blur(10px)}
.hintbox h1{margin:0 0 8px;font-size:24px}.hintbox p{margin:5px 0;color:var(--muted);line-height:1.5}.step{color:var(--accent)!important;font-weight:800}
@media(max-width:700px){
  .brand{display:none}.topbar{gap:5px}.topbar button,.filebtn{padding:9px 9px;font-size:12px}
  .panel{top:auto;bottom:58px;right:8px;left:8px;width:auto;max-height:44vh;overflow:auto}
  .optional{display:none}.status{bottom:8px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <div id="viewport"></div>
  <div class="topbar">
    <div class="brand">Almas <b>3D</b> Editor</div>
    <label class="filebtn map" for="mapFiles">🗺️ 1. Карта</label>
    <input id="mapFiles" class="files" type="file" multiple accept=".glb,.gltf,.obj,.stl,.fbx,.bin,.png,.jpg,.jpeg,.webp"/>
    <label id="charLabel" class="filebtn char disabled" for="charFiles">🧍 2. Кейіпкер</label>
    <input id="charFiles" class="files" type="file" multiple accept=".glb,.gltf,.obj,.stl,.fbx,.bin,.png,.jpg,.jpeg,.webp"/>
    <button id="frame">⌂</button>
    <button id="grid" class="optional"># Grid</button>
    <div class="spacer"></div>
    <button id="fullscreen">⛶</button>
  </div>

  <div id="editPanel" class="panel">
    <h3>🧍 Кейіпкерді қолмен реттеу</h3>
    <div class="modes">
      <button id="moveMode" class="active">↔ Жылжыту</button>
      <button id="rotateMode">⟳ Бұру</button>
      <button id="scaleMode">⤢ Өлшем</button>
    </div>

    <div class="axisrow">
      <button data-move="x,-1">X−</button><button data-move="x,1">X+</button>
      <button data-move="y,-1">Y−</button><button data-move="y,1">Y+</button>
      <button data-move="z,-1">Z−</button><button data-move="z,1">Z+</button>
    </div>

    <div class="scaleRow">
      <button id="turnLeft">↶ 15°</button>
      <button id="scaleDown">− Өлшем</button>
      <button id="scaleUp">+ Өлшем</button>
    </div>

    <div class="values">
      <label>X<input id="px" type="number" step="0.01"/></label>
      <label>Y<input id="py" type="number" step="0.01"/></label>
      <label>Z<input id="pz" type="number" step="0.01"/></label>
      <label>Rot Y°<input id="ry" type="number" step="1"/></label>
      <label>Scale<input id="sc" type="number" step="0.01" min="0.001"/></label>
      <label>Қадам<input id="stepSize" type="number" value="0.1" step="0.05" min="0.001"/></label>
    </div>
  </div>

  <div class="hint" id="hint">
    <div class="hintbox">
      <h1>Карта + кейіпкер</h1>
      <p class="step">1-қадам: картаны жүкте</p>
      <p>Сосын кейіпкер батырмасы ашылады. Кейіпкерді gizmo немесе батырмалармен қолмен реттейміз.</p>
    </div>
  </div>
  <div class="status" id="status">Алдымен картаны жүкте</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const viewport=document.querySelector('#viewport');
const statusEl=document.querySelector('#status');
const hint=document.querySelector('#hint');
const mapFiles=document.querySelector('#mapFiles');
const charFiles=document.querySelector('#charFiles');
const charLabel=document.querySelector('#charLabel');
const editPanel=document.querySelector('#editPanel');
const setStatus=t=>statusEl.textContent=t;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0f14);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,20000);
camera.position.set(5,4,7);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
viewport.appendChild(renderer.domElement);

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;
orbit.dampingFactor=.07;

const transform=new TransformControls(camera,renderer.domElement);
scene.add(transform.getHelper());
transform.setMode('translate');
transform.setSpace('world');
transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);
transform.addEventListener('objectChange',()=>syncInputs());

scene.add(new THREE.HemisphereLight(0xddeeff,0x333344,2.25));
const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(8,12,7);key.castShadow=true;scene.add(key);
const fill=new THREE.DirectionalLight(0x8aa6ff,1.1);fill.position.set(-6,3,-5);scene.add(fill);

const gridHelper=new THREE.GridHelper(40,40,0x52606f,0x26313c);
gridHelper.material.transparent=true;gridHelper.material.opacity=.4;scene.add(gridHelper);

let mapObj=null,charObj=null,charMixer=null;
const clock=new THREE.Clock();

function disposeObject(obj){
  obj?.traverse(n=>{
    n.geometry?.dispose?.();
    const mats=Array.isArray(n.material)?n.material:(n.material?[n.material]:[]);
    mats.forEach(m=>{
      Object.values(m).forEach(v=>{if(v&&v.isTexture)v.dispose?.()});
      m.dispose?.();
    });
  });
}

function normalizeMaterials(root){
  root.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true;o.receiveShadow=true;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.filter(Boolean).forEach(m=>{
        if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;
        m.needsUpdate=true;
      });
    }
  });
}

function frameObject(obj){
  if(!obj)return;
  obj.updateWorldMatrix(true,true);
  const box=new THREE.Box3().setFromObject(obj);
  if(box.isEmpty())return;
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  const fov=camera.fov*Math.PI/180;
  const dist=Math.abs(maxDim/(2*Math.tan(fov/2)))*1.45;
  camera.near=Math.max(maxDim/10000,.001);
  camera.far=Math.max(2000,maxDim*1000);
  camera.updateProjectionMatrix();
  camera.position.set(center.x+dist*.75,center.y+dist*.55,center.z+dist);
  orbit.target.copy(center);
  orbit.update();
}

const ext=name=>name.toLowerCase().split('.').pop();

async function parseFiles(fileList){
  const files=[...fileList];
  const model=files.find(f=>['glb','gltf','obj','stl','fbx'].includes(ext(f.name)));
  if(!model)throw new Error('3D файл табылмады');
  const urls=new Map(files.map(f=>[f.name,URL.createObjectURL(f)]));
  const manager=new THREE.LoadingManager();
  manager.setURLModifier(url=>{
    const clean=decodeURIComponent(url.split('/').pop().split('?')[0]);
    return urls.get(clean)||url;
  });
  try{
    const e=ext(model.name),u=urls.get(model.name);
    if(e==='glb'||e==='gltf'){
      const g=await new GLTFLoader(manager).loadAsync(u);
      return {object:g.scene,animations:g.animations||[],name:model.name};
    }
    if(e==='obj') return {object:await new OBJLoader(manager).loadAsync(u),animations:[],name:model.name};
    if(e==='stl'){
      const geo=await new STLLoader(manager).loadAsync(u);geo.computeVertexNormals();
      return {object:new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xb9c5d4,roughness:.7})),animations:[],name:model.name};
    }
    if(e==='fbx'){
      const o=await new FBXLoader(manager).loadAsync(u);
      return {object:o,animations:o.animations||[],name:model.name};
    }
  }finally{
    setTimeout(()=>{for(const u of urls.values())URL.revokeObjectURL(u)},8000);
  }
}

async function loadMap(files){
  setStatus('Карта жүктелуде…');
  try{
    const r=await parseFiles(files);
    if(mapObj){scene.remove(mapObj);disposeObject(mapObj)}
    mapObj=r.object;normalizeMaterials(mapObj);scene.add(mapObj);
    frameObject(mapObj);
    charLabel.classList.remove('disabled');
    hint.style.display='none';
    setStatus(r.name+' • карта дайын. Енді кейіпкерді жүкте');
  }catch(e){console.error(e);setStatus('Карта қатесі: '+e.message)}
}

async function loadCharacter(files){
  if(!mapObj){setStatus('Алдымен картаны жүкте');return}
  setStatus('Кейіпкер жүктелуде…');
  try{
    const r=await parseFiles(files);
    if(charObj){transform.detach();scene.remove(charObj);disposeObject(charObj)}
    charObj=r.object;normalizeMaterials(charObj);

    const mapBox=new THREE.Box3().setFromObject(mapObj);
    const center=mapBox.getCenter(new THREE.Vector3());
    const minY=mapBox.min.y;
    charObj.position.set(center.x,minY,center.z);

    scene.add(charObj);
    transform.attach(charObj);
    charMixer=null;
    if(r.animations.length){
      charMixer=new THREE.AnimationMixer(charObj);
      r.animations.forEach(a=>charMixer.clipAction(a).play());
    }
    editPanel.classList.add('show');
    syncInputs();
    setStatus(r.name+' • кейіпкер дайын. Енді қолмен ретте');
  }catch(e){console.error(e);setStatus('Кейіпкер қатесі: '+e.message)}
}

function syncInputs(){
  if(!charObj)return;
  document.querySelector('#px').value=charObj.position.x.toFixed(3);
  document.querySelector('#py').value=charObj.position.y.toFixed(3);
  document.querySelector('#pz').value=charObj.position.z.toFixed(3);
  document.querySelector('#ry').value=THREE.MathUtils.radToDeg(charObj.rotation.y).toFixed(1);
  document.querySelector('#sc').value=charObj.scale.x.toFixed(3);
}

function applyInputs(){
  if(!charObj)return;
  const n=id=>parseFloat(document.querySelector(id).value);
  const x=n('#px'),y=n('#py'),z=n('#pz'),ry=n('#ry'),s=n('#sc');
  if(Number.isFinite(x))charObj.position.x=x;
  if(Number.isFinite(y))charObj.position.y=y;
  if(Number.isFinite(z))charObj.position.z=z;
  if(Number.isFinite(ry))charObj.rotation.y=THREE.MathUtils.degToRad(ry);
  if(Number.isFinite(s)&&s>0)charObj.scale.setScalar(s);
  transform.updateMatrixWorld?.();
}

['#px','#py','#pz','#ry','#sc'].forEach(id=>document.querySelector(id).addEventListener('change',applyInputs));

mapFiles.addEventListener('change',e=>loadMap(e.target.files));
charFiles.addEventListener('change',e=>loadCharacter(e.target.files));

document.querySelector('#frame').onclick=()=>frameObject(mapObj||charObj);
document.querySelector('#grid').onclick=()=>gridHelper.visible=!gridHelper.visible;
document.querySelector('#fullscreen').onclick=async()=>{
  try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}
};

const moveMode=document.querySelector('#moveMode'),rotateMode=document.querySelector('#rotateMode'),scaleMode=document.querySelector('#scaleMode');
function setMode(mode,btn){
  transform.setMode(mode);
  [moveMode,rotateMode,scaleMode].forEach(b=>b.classList.remove('active'));btn.classList.add('active');
}
moveMode.onclick=()=>setMode('translate',moveMode);
rotateMode.onclick=()=>setMode('rotate',rotateMode);
scaleMode.onclick=()=>setMode('scale',scaleMode);

document.querySelectorAll('[data-move]').forEach(btn=>btn.onclick=()=>{
  if(!charObj)return;
  const [axis,dir]=btn.dataset.move.split(',');
  const step=Math.max(.001,parseFloat(document.querySelector('#stepSize').value)||.1);
  charObj.position[axis]+=step*Number(dir);
  syncInputs();
});
document.querySelector('#turnLeft').onclick=()=>{
  if(!charObj)return;
  charObj.rotation.y+=THREE.MathUtils.degToRad(15);syncInputs();
};
document.querySelector('#scaleDown').onclick=()=>{
  if(!charObj)return;
  charObj.scale.multiplyScalar(.9);syncInputs();
};
document.querySelector('#scaleUp').onclick=()=>{
  if(!charObj)return;
  charObj.scale.multiplyScalar(1.1);syncInputs();
};

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(()=>{
  const dt=clock.getDelta();
  charMixer?.update(dt);
  orbit.update();
  renderer.render(scene,camera);
});
</script>
</body>
</html>
