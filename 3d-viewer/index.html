<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b10">
<title>Almas Game</title>
<style>
:root{color-scheme:dark;--panel:rgba(9,14,20,.64);--line:rgba(255,255,255,.14);--text:#fff;--muted:#aeb8c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10;font-family:system-ui,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#070b10;color:#fff;text-align:center}
#loading.hidden{display:none}
#loading b{display:block;font-size:24px;margin-bottom:8px}
#loading span{color:var(--muted)}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
.badge{pointer-events:auto;padding:9px 12px;border:1px solid var(--line);border-radius:13px;background:var(--panel);backdrop-filter:blur(10px);font-weight:800}
#fs{border:1px solid var(--line);border-radius:13px;background:var(--panel);color:#fff;padding:9px 12px;font-size:18px}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.055);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.35)}
#run{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#fff;font-weight:900;pointer-events:auto}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.35);color:var(--muted);font-size:12px}
@media(hover:hover) and (pointer:fine){#joy,#run{opacity:.3}#hint{display:block}}
@media(max-width:700px){#hint{display:none}.badge{font-size:13px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><b>ALMAS GAME</b><span id="loadText">Карта жүктелуде…</span></div></div>
<div id="hud">
  <div class="top">
    <div class="badge">ALMAS GAME</div>
    <button id="fs">⛶</button>
  </div>
  <div id="joy"><div id="stick"></div></div>
  <button id="run">RUN</button>
  <div id="hint">WASD • Shift — жүгіру • тышқанмен камера</div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const root=document.querySelector('#game');
const loading=document.querySelector('#loading');
const loadText=document.querySelector('#loadText');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb5c9);
scene.fog=new THREE.Fog(0x9bb5c9,4,18);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdcecff,0x3d4650,2.1));
const sun=new THREE.DirectionalLight(0xffffff,3.1);
sun.position.set(4,7,3);
sun.castShadow=true;
scene.add(sun);

const loader=new GLTFLoader();
let map=null,player=null,mixer=null;
const clock=new THREE.Clock();

const move={x:0,z:0,run:false};
const keys=new Set();

let yaw=Math.PI;
let pitch=.22;
let camDistance=.16;
let dragging=false,lastX=0,lastY=0;

function box(o){o.updateWorldMatrix(true,true);return new THREE.Box3().setFromObject(o)}
function size(o){return box(o).getSize(new THREE.Vector3())}

function floorY(x,z){
  if(!map)return 0;
  const b=box(map),h=Math.max(.1,b.max.y-b.min.y);
  const ray=new THREE.Raycaster(new THREE.Vector3(x,b.max.y+h*3,z),new THREE.Vector3(0,-1,0),0,h*8);
  const hits=ray.intersectObject(map,true);
  const nm=new THREE.Matrix3(),ys=[];
  for(const hit of hits){
    if(!hit.face)continue;
    nm.getNormalMatrix(hit.object.matrixWorld);
    const n=hit.face.normal.clone().applyMatrix3(nm).normalize();
    if(n.y>.42)ys.push(hit.point.y);
  }
  return ys.length?Math.max(...ys):b.min.y;
}

function placePlayer(){
  player.position.set(0,0,0);
  player.rotation.set(0,0,0);
  player.scale.set(1,1,1);
  player.updateMatrixWorld(true);

  const s=size(player);
  if(s.x>=s.y&&s.x>=s.z)player.rotation.z=Math.PI/2;
  else if(s.z>=s.x&&s.z>=s.y)player.rotation.x=-Math.PI/2;

  player.updateMatrixWorld(true);
  const mb=box(map),mc=mb.getCenter(new THREE.Vector3());
  const pb=box(player),pc=pb.getCenter(new THREE.Vector3());

  player.position.x+=mc.x-pc.x;
  player.position.z+=mc.z-pc.z;
  player.updateMatrixWorld(true);

  const fy=floorY(player.position.x,player.position.z);
  player.position.y+=fy-box(player).min.y;
  player.updateMatrixWorld(true);
}

async function start(){
  try{
    loadText.textContent='Sendstone картасы жүктелуде…';
    const mg=await loader.loadAsync('./assets/sendstone_new.glb');
    map=mg.scene;
    map.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.castShadow=false}});
    scene.add(map);

    loadText.textContent='SAS кейіпкері жүктелуде…';
    const pg=await loader.loadAsync('./assets/sas__cs2_agent_model_blue.glb');
    player=pg.scene;
    player.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
    scene.add(player);
    placePlayer();

    if(pg.animations?.length){
      mixer=new THREE.AnimationMixer(player);
      const clip=pg.animations[0];
      if(clip)mixer.clipAction(clip).play();
    }

    const ps=size(player);
    camDistance=Math.max(ps.y*5, .16);

    loading.classList.add('hidden');
  }catch(e){
    console.error(e);
    loadText.textContent='Модель файлдары табылмады';
  }
}

function inputVector(){
  let x=move.x,z=move.z;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))x-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight'))x+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp'))z-=1;
  if(keys.has('KeyS')||keys.has('ArrowDown'))z+=1;
  const v=new THREE.Vector2(x,z);
  if(v.lengthSq()>1)v.normalize();
  return v;
}

function updatePlayer(dt){
  if(!player)return;
  const inp=inputVector();
  if(inp.lengthSq()<.001)return;

  const speed=(move.run||keys.has('ShiftLeft')||keys.has('ShiftRight'))?.18:.095;
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const dir=forward.multiplyScalar(-inp.y).add(right.multiplyScalar(inp.x)).normalize();

  const next=player.position.clone().addScaledVector(dir,speed*dt);
  const fy=floorY(next.x,next.z);
  if(Number.isFinite(fy)){
    next.y += fy-box(player).min.y;
    player.position.copy(next);
  }

  const targetRot=Math.atan2(dir.x,dir.z);
  let d=targetRot-player.rotation.y;
  d=Math.atan2(Math.sin(d),Math.cos(d));
  player.rotation.y+=d*Math.min(1,dt*10);
}

function updateCamera(){
  if(!player)return;
  const b=box(player),center=b.getCenter(new THREE.Vector3());
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  const offset=new THREE.Vector3(
    Math.sin(yaw)*cp*camDistance,
    sp*camDistance + size(player).y*.55,
    Math.cos(yaw)*cp*camDistance
  );
  camera.position.lerp(center.clone().add(offset),.16);
  camera.lookAt(center.x,center.y+size(player).y*.28,center.z);
}

addEventListener('keydown',e=>keys.add(e.code));
addEventListener('keyup',e=>keys.delete(e.code));

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){dragging=true;lastX=e.clientX;lastY=e.clientY}
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lastX)*.006;
  pitch=Math.max(-.15,Math.min(.65,pitch-(e.clientY-lastY)*.004));
  lastX=e.clientX;lastY=e.clientY;
});

const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');
let joyId=null;
function setJoy(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=41,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);
  dx*=k;dy*=k;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  move.x=dx/max;move.z=dy/max;
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function resetJoy(){joyId=null;move.x=0;move.z=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);

const run=document.querySelector('#run');
run.addEventListener('pointerdown',()=>move.run=true);
run.addEventListener('pointerup',()=>move.run=false);
run.addEventListener('pointercancel',()=>move.run=false);

document.querySelector('#fs').onclick=async()=>{
  try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}
};

let lastTouch=null;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1)lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length!==1||!lastTouch)return;
  const t=e.touches[0];
  yaw-=(t.clientX-lastTouch.x)*.006;
  pitch=Math.max(-.15,Math.min(.65,pitch-(t.clientY-lastTouch.y)*.004));
  lastTouch={x:t.clientX,y:t.clientY};
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>lastTouch=null,{passive:true});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  mixer?.update(dt);
  updatePlayer(dt);
  updateCamera();
  renderer.render(scene,camera);
});
start();
</script>
</body>
</html>
